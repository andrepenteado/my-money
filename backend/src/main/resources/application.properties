spring.application.name=my-money
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/my_money}
spring.datasource.username=${DATABASE_USER:my_money}
spring.datasource.password=${DATABASE_PASSWORD:my_money_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jackson.deserialization.accept-float-as-int=false
